name: check-submission

# 学生の Pull Request を自動チェックする:
#   1. methods/ と submissions/ 以外(共通コード・データ)を変更していないか
#   2. 評価関数のテストが通るか
#   3. 提出ファイルが正しく評価できるか(スコアを表示)
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 変更してよいファイルだけか確認
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
          echo "変更されたファイル:"; cat changed.txt
          if grep -vE '^(methods|submissions)/' changed.txt; then
            echo "::error::上のファイルは共通コード・共通データです。methods/ と submissions/ 以外は変更しないでください"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 評価関数のテスト
        run: python -m pytest -q

      - name: 提出ファイルの評価
        run: |
          for f in $(grep -E '^submissions/.*\.(json|csv)$' changed.txt || true); do
            if [ -f "$f" ]; then
              echo "== $f"
              python scripts/evaluate.py "$f"
            fi
          done
